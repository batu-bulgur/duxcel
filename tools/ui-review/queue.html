<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Duxcel · Feedback queue</title>
<style>
@font-face{font-family:Plex;src:url('/fonts/IBMPlexSans-Regular.otf')}@font-face{font-family:Plex;src:url('/fonts/IBMPlexSans-SemiBold.otf');font-weight:600}
*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#202d38;font:14px/1.5 Plex,sans-serif}header{background:#f8fafb;border-bottom:1px solid #cbd5dc;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:18px;margin:0;font-weight:600}a{color:#285f86}main{max-width:1120px;margin:auto;padding:20px 24px}.intro{margin:0 0 16px;color:#526674}.issue{background:white;border:1px solid #c9d4dc;margin:0 0 12px;padding:14px 16px;scroll-margin:16px}.issue:target{border-color:#285f86;box-shadow:0 0 0 2px #285f8622}.line{display:flex;justify-content:space-between;gap:12px}.note{font-size:15px;margin:7px 0;white-space:pre-wrap}.meta{font-size:12px;color:#526674;overflow-wrap:anywhere}.badge{font-size:11px;background:#e8eff5;padding:2px 6px;white-space:nowrap}summary{cursor:pointer;font-size:12px;color:#285f86;margin-top:10px}pre{font:12px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f8;padding:12px}#connection{font-size:12px;color:#526674}.empty{border-top:1px solid #c9d4dc;padding-top:16px}@media(max-width:600px){header,main{padding:12px}.line{flex-wrap:wrap}}
</style></head><body><header><h1>Duxcel · Feedback queue</h1><a href="/">Return to UI review</a></header><main><p class="intro">Open the pencil toolbar in the UI, click the element, and add your note. Use <strong>Did → Happened → Expected</strong> for interaction bugs. Feedback stays local. Notes do not automatically change the design or native app.</p><p id="connection" role="status">Connecting…</p><div id="issues"></div></main>
<script type="module">
const connection=document.querySelector('#connection'),list=document.querySelector('#issues');let previous='';
const element=(tag,text,className)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el};
async function refresh(){try{const response=await fetch('/__review/queue');if(!response.ok)throw new Error();const data=await response.json();connection.textContent=`${data.issues.length} notes · connected locally · reference ${data.provenance.referenceSha256.slice(0,12)}`;const serialized=JSON.stringify(data.issues);if(serialized===previous)return;previous=serialized;const open=new Set([...list.querySelectorAll('details[open]')].map(el=>el.closest('article').id));list.replaceChildren();if(!data.issues.length)list.append(element('p','No feedback yet. Add a note on any button, menu, field, cell or pane.','empty'));for(const issue of data.issues){const a=issue.annotation,card=element('article',undefined,'issue');card.id=issue.id;const line=element('div',undefined,'line'),link=element('a',issue.id);link.href=`#${issue.id}`;line.append(link,element('span',a.status||'pending','badge'));card.append(line,element('p',a.comment,'note'),element('div',`${a.element} · ${a.elementPath}`,'meta'));if(issue.context?.state){const s=issue.context.state;card.append(element('div',`${s.sheet||'Unknown sheet'} · ${s.tab||'—'} · ${s.ribbon||'—'} ribbon · ${s.viewport?.width||'?'} × ${s.viewport?.height||'?'} · UI ${Number(s.uiScale||1)*100}%`,'meta'))}const details=element('details');details.open=open.has(issue.id);details.append(element('summary','Target, captured state, recent actions and history'),element('pre',JSON.stringify(issue,null,2)));card.append(details);list.append(card)}}catch{connection.textContent='Disconnected — saved feedback remains on disk. Reconnect before adding more notes.'}}
refresh();setInterval(refresh,2000);
</script></body></html>
