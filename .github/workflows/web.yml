name: Web CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Web tests and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DUCKDB_CFLAGS: -Ibuild/ci/include
      RAYLIB_CFLAGS: ''
      RAYLIB_LIBS: ''
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - run: python3 tools/prepare_web_ci.py
      - run: make test-browser-core
      - run: node --test web/*.test.mjs tools/cdp_keyboard.test.mjs tools/test_web_cdp.test.mjs
      - run: python3 tools/web_toolchain_test.py
      - run: python3 tools/test_web_object_cache.py
      - run: python3 tools/test_package_web_pages.py

  build:
    name: Web build and browser smoke (Wasm)
    # Starts alongside web tests; no native-platform build dependency.
    # macOS is the build host for the pinned SDK, not the product target.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DUCKDB_CFLAGS: -Ibuild/ci/include
      RAYLIB_CFLAGS: ''
      RAYLIB_LIBS: ''
      DUXCEL_CHROMIUM: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/web/toolchain/downloads
          key: web-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/toolchain.lock.json') }}
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - run: python3 tools/prepare_web_ci.py
      - run: python3 tools/web_toolchain.py bootstrap
      - run: python3 tools/build_web_raylib.py
      - run: make web
      - name: Stage verified production runtime
        run: python3 tools/package_web_pages.py
      - name: Real browser import and filters at the Pages project subpath
        run: python3 tools/test_web_pages.py --directory build/pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-failure-${{ github.run_id }}
          path: |
            build/web/**/build.txt
            tests/results/runs/
          retention-days: 7

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy tested runtime
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
