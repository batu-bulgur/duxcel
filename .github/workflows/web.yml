name: Web CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Browser core and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DUCKDB_CFLAGS: -Ibuild/ci/include
      RAYLIB_CFLAGS: ''
      RAYLIB_LIBS: ''
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - run: python3 tools/prepare_web_ci.py
      - run: make test-browser-core
      - run: node --test web/*.test.mjs tools/cdp_keyboard.test.mjs tools/test_web_cdp.test.mjs
      - run: python3 tools/web_toolchain_test.py
      - run: python3 tools/test_web_object_cache.py
      - run: python3 tools/test_package_web_pages.py

  build:
    name: Shared C99 Wasm build
    needs: test
    # Matches the checksum-pinned darwin-arm64 SDK; no new native runtime.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DUCKDB_CFLAGS: -Ibuild/ci/include
      RAYLIB_CFLAGS: ''
      RAYLIB_LIBS: ''
      DUXCEL_CHROMIUM: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/web/toolchain/downloads
          key: web-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/toolchain.lock.json') }}
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - run: python3 tools/prepare_web_ci.py
      - run: python3 tools/web_toolchain.py bootstrap
      - run: python3 tools/build_web_raylib.py
      - run: make web
      - name: Stage verified production runtime
        run: python3 tools/package_web_pages.py
      - name: Real browser import and filters at the Pages project subpath
        run: python3 tools/test_web_pages.py --directory build/pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-failure-${{ github.run_id }}
          path: |
            build/web/**/build.txt
            tests/results/runs/
          retention-days: 7

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy tested runtime
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
