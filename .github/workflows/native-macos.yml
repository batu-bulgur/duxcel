name: Native macOS (manual, paused)

# No push/PR triggers. Keep this workflow disabled in GitHub until native CI
# is wanted; enabling it later still requires an explicit manual dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-macos:
    name: Native macOS build and headless tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install native build dependencies
        run: brew install raylib duckdb pkg-config
      - name: Build native macOS executable
        run: make duxcel
      - name: Headless release and sanitizer module tests
        run: make test-fast
